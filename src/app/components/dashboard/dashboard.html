<div style="padding: 24px; font-family: system-ui, -apple-system, sans-serif;">
  <h1 style="color: #2c3e50; margin-bottom: 24px;">Arksibero (1899) — Educator Diagnostic Portal</h1>

  <!-- Chart Card -->
  <div style="background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 650px; margin-bottom: 32px;">
    <canvas baseChart [data]="chartData" [type]="'bar'"></canvas>
  </div>

  <!-- Telemetry Records Table -->
  <h2 style="color: #34495e; margin-bottom: 16px;">Recent Student Gameplay Records</h2>
  <div style="overflow-x: auto; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
          <th style="padding: 12px 16px;">Student ID</th>
          <th style="padding: 12px 16px;">SHEG Rubric Tier</th>
          <th style="padding: 12px 16px;">Verification Bypass Flagged?</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of studentLogs" style="border-bottom: 1px solid #e9ecef;">
          <td style="padding: 12px 16px; font-weight: 500;">{{ log.studentId }}</td>
          <td style="padding: 12px 16px;">{{ log.shegRubricTier }}</td>
          <td style="padding: 12px 16px;">
            <span *ngIf="log.verificationBypassRate" style="color: #d32f2f; font-weight: bold;">⚠️ Yes (Bypassed)</span>
            <span *ngIf="!log.verificationBypassRate" style="color: #388e3c; font-weight: bold;">✅ No (Verified)</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
